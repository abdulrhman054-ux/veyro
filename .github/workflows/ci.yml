name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt pytest httpx
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (types, build, committed dist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: frontend/dist matches the source
        run: |
          # The app ships the built UI (users don't need Node), so a PR must commit the rebuilt dist.
          if ! git diff --quiet -- frontend/dist || [ -n "$(git status --porcelain -- frontend/dist)" ]; then
            git status --short -- frontend/dist
            echo "::error::frontend/dist is out of date. Run 'cd frontend && npm run build' and commit frontend/dist."
            exit 1
          fi

  e2e:
    name: Browser end-to-end suites
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (into .venv, as tools/e2e/run_all.sh expects)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt pytest httpx playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run all suites (fake model, stubbed prices, no keys)
        run: bash tools/e2e/run_all.sh
      - name: Keep screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verification
          path: |
            verification/e2e/*.png
            verification/e2e/server_*.log
          retention-days: 7
